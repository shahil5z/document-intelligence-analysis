[project]
name = "document-intelligence-platform"
version = "0.1.0"
description = "Backend foundation for a document intelligence platform: authenticated uploads, durable storage, and asynchronous processing jobs."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.114",
    "celery>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi>=0.143.3",
    "gunicorn>=26.2.0",
    "httpx2>=2.13.1",
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "openai>=3.35.1",
    "pgvector>=0.5.1",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0",
    "tokenizers>=0.23.3",
    "uvicorn-worker>=0.4.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# PyTorch backend: EMBEDDING_PROVIDER=sentence-transformers, RERANKING_ENABLED=true and the
# calibration scripts. Not installed in the image (uv sync --extra torch to add it).
torch = [
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]

[tool.uv]
package = false

# CPU-only PyTorch wheels (optional "torch" extra). The default PyPI wheels for
# Linux bundle CUDA libraries (several GB) that this CPU-only service never uses.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.114",
    "celery-types>=0.26.0",
    "httpx2>=2.13.1",
    "moto[s3]>=5.2.4",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL", "SLF", "C4", "PT", "TID", "ARG"]
ignore = [
    "PLR0913", # services take explicit dependencies; keyword-only args keep calls readable
    "PLR2004", # magic values in comparisons are fine in tests and status codes
]

[tool.ruff.lint.per-file-ignores]
# Fixture-heavy tests take many positional fixture arguments by design.
"tests/**" = ["S101", "S105", "S106", "ARG001", "PLR2004", "PLR0917"]
"alembic/versions/**" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic", "scripts"]
explicit_package_bases = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

# Optional "torch" extra (absent from the default install) and onnxruntime (no stubs).
[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "torch", "torch.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

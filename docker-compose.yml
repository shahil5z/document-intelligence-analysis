# Local development stack: API, Celery worker, PostgreSQL (with pgvector) and Redis.
# The embedding model (~130 MB) is downloaded on first use into the model_cache volume.
# Create .env first:  python scripts/generate_env.py   then:  docker compose up --build -d
# Required in .env: JWT_SECRET_KEY, POSTGRES_PASSWORD, REDIS_PASSWORD.

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-Document Intelligence Platform}
  APP_ENV: ${APP_ENV:-development}
  DEBUG: ${DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-dip}
  POSTGRES_USER: ${POSTGRES_USER:-dip}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_PATH: /data/storage
  MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
  # Used only by POST /ask (LLM_PROVIDER=openai). Never needed for upload, processing or /search.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # DIP2: processing, retrieval and question answering (defaults match app/core/config.py).
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence-transformers}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
  CHUNK_SIZE: ${CHUNK_SIZE:-400}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-60}
  MAX_CHUNKS_PER_DOCUMENT: ${MAX_CHUNKS_PER_DOCUMENT:-1000}
  TOP_K: ${TOP_K:-5}
  MAX_TOP_K: ${MAX_TOP_K:-20}
  CANDIDATE_K: ${CANDIDATE_K:-40}
  MAX_QUERY_LENGTH: ${MAX_QUERY_LENGTH:-1000}
  MIN_EVIDENCE_SIMILARITY: ${MIN_EVIDENCE_SIMILARITY:-0.48}
  RERANKING_ENABLED: ${RERANKING_ENABLED:-false}
  RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
  RERANK_TOP_K: ${RERANK_TOP_K:-20}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
  MAX_CONTEXT_TOKENS: ${MAX_CONTEXT_TOKENS:-3000}
  # Hugging Face model cache on a named volume shared by api and worker (downloaded once).
  HF_HOME: /data/models
  # Set to 1 once the model is in the cache (or pre-seeded) to skip Hugging Face network checks.
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}

x-app-image: &app-image
  build:
    context: .
  image: document-intelligence-platform:local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dip}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    environment:
      # redis-cli reads this, so the healthcheck authenticates without a CLI argument.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app-image
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-image
    environment: *app-environment
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - storage_data:/data/storage
      - model_cache:/data/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *app-image
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *app-environment
    volumes:
      - storage_data:/data/storage
      - model_cache:/data/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
  model_cache:

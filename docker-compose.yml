# Local development stack: API, Celery worker, PostgreSQL (with pgvector) and Redis.
# The embedding model (~130 MB) is downloaded on first use into the model_cache volume.
# Create .env first:  python scripts/generate_env.py   then:  docker compose up --build -d
# Required in .env: JWT_SECRET_KEY, POSTGRES_PASSWORD, REDIS_PASSWORD.

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-Document Intelligence Platform}
  APP_ENV: ${APP_ENV:-development}
  DEBUG: ${DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-dip}
  POSTGRES_USER: ${POSTGRES_USER:-dip}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_PATH: /data/storage
  MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
  # Used only by POST /ask (LLM_PROVIDER=openai). Never needed for upload, processing or /search.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # DIP2: processing, retrieval and question answering (defaults match app/core/config.py).
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence-transformers}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
  CHUNK_SIZE: ${CHUNK_SIZE:-400}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-60}
  MAX_CHUNKS_PER_DOCUMENT: ${MAX_CHUNKS_PER_DOCUMENT:-1000}
  TOP_K: ${TOP_K:-5}
  MAX_TOP_K: ${MAX_TOP_K:-20}
  CANDIDATE_K: ${CANDIDATE_K:-40}
  MAX_QUERY_LENGTH: ${MAX_QUERY_LENGTH:-1000}
  MIN_EVIDENCE_SIMILARITY: ${MIN_EVIDENCE_SIMILARITY:-0.48}
  RERANKING_ENABLED: ${RERANKING_ENABLED:-false}
  RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
  RERANK_TOP_K: ${RERANK_TOP_K:-20}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
  MAX_CONTEXT_TOKENS: ${MAX_CONTEXT_TOKENS:-3000}
  # Hugging Face model cache on a named volume shared by api and worker (downloaded once).
  HF_HOME: /data/models
  # Set to 1 once the model is in the cache (or pre-seeded) to skip Hugging Face network checks.
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
  # DIP3: hardening, rate limiting, observability (defaults match app/core/config.py).
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
  UPLOAD_BODY_OVERHEAD_BYTES: ${UPLOAD_BODY_OVERHEAD_BYTES:-65536}
  SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
  RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-5/minute}
  RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10/minute}
  RATE_LIMIT_LOGIN_PER_EMAIL: ${RATE_LIMIT_LOGIN_PER_EMAIL:-5/minute}
  RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-30/minute}
  RATE_LIMIT_SEARCH: ${RATE_LIMIT_SEARCH:-60/minute}
  RATE_LIMIT_ASK: ${RATE_LIMIT_ASK:-20/minute}
  RATE_LIMIT_REPROCESS: ${RATE_LIMIT_REPROCESS:-10/minute}
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-240}
  CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-300}

# Container hardening shared by the application services (api, worker, migrate).
x-app-hardening: &app-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true

x-app-image: &app-image
  build:
    context: .
  image: document-intelligence-platform:local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dip}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    environment:
      # redis-cli reads this, so the healthcheck authenticates without a CLI argument.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: [*app-image, *app-hardening]
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: [*app-image, *app-hardening]
    environment: *app-environment
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - storage_data:/data/storage
      - model_cache:/data/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness only; /health/ready (PostgreSQL + Redis) is for load balancers.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    <<: [*app-image, *app-hardening]
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      <<: *app-environment
      # Worker metrics: prefork children write to this tmpfs, the main process serves them
      # on 9100 inside the compose network only (not published to the host).
      WORKER_METRICS_PORT: "9100"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    tmpfs:
      - /tmp/prometheus:mode=1777,size=16m
    expose:
      - "9100"
    volumes:
      - storage_data:/data/storage
      - model_cache:/data/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Let a running document finish (soft limit 240 s) before SIGKILL on shutdown.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
  model_cache:

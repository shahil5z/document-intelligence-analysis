# 1 GB VM override (untracked on the server). Use with:
#   docker compose -f docker-compose.prod.yml -f docker-compose.micro.yml --env-file .env.production ...
# One embedding model copy: the API (EMBEDDING_PROVIDER=onnx) holds it; the worker
# (EMBEDDING_PROVIDER=remote) calls POST /internal/embed on the compose network.
services:
  postgres:
    command: [postgres, -c, shared_buffers=64MB, -c, work_mem=4MB, -c, maintenance_work_mem=32MB, -c, max_connections=30, -c, effective_cache_size=256MB]
    shm_size: 64m
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 256m}
  redis:
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        rm -f /tmp/redis-auth.conf &&
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis-auth.conf &&
        chown redis:redis /tmp/redis-auth.conf &&
        unset REDIS_PASSWORD &&
        exec docker-entrypoint.sh redis-server /tmp/redis-auth.conf --appendonly yes
        --maxmemory 32mb --maxmemory-policy noeviction
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 64m}
  migrate:
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 256m}
  api:
    environment:
      WEB_CONCURRENCY: "1"
      TORCH_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      EMBEDDING_PROVIDER: onnx
      INTERNAL_EMBED_SECRET: ${INTERNAL_EMBED_SECRET:?INTERNAL_EMBED_SECRET must be set in .env.production}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 400m}
  worker:
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-B", "--schedule", "/tmp/beat/celerybeat-schedule", "--loglevel=INFO", "--concurrency=1", "--max-tasks-per-child=200"]
    environment:
      EMBEDDING_PROVIDER: remote
      EMBEDDING_REMOTE_URL: http://api:8000/internal/embed
      INTERNAL_EMBED_SECRET: ${INTERNAL_EMBED_SECRET:?INTERNAL_EMBED_SECRET must be set in .env.production}
      TOKENIZERS_PARALLELISM: "false"
    tmpfs:
      - /tmp/prometheus:mode=1777,size=16m
      - /tmp/beat:mode=1777,size=8m
    # Lightweight liveness: the main worker process serves metrics on 9100 once ready.
    # Plain urllib, no Celery import, no broker broadcast, no extra celery process.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=3).status == 200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 256m}
  beat:
    profiles: [disabled]
  caddy:
    volumes:
      - ./deploy/caddy/Caddyfile.micro:/etc/caddy/Caddyfile:ro
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 64m}
